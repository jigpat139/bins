<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>What's in your Bin?</title>
<meta name="theme-color" content="#2f6f4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f4f2ec;--card:#fff;--ink:#1b1d1a;--muted:#6b6f68;--line:#e6e2d8;
  --accent:#23654a;--accent-2:#3f9b6e;--accent-ink:#fff;--danger:#b3261e;--chip:#e9f2ec;
  --radius:18px;--shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121412;--card:#1c1f1c;--ink:#ecefe9;--muted:#9ba198;--line:#2e322d;
  --accent:#6fcf9a;--accent-2:#2f7d57;--accent-ink:#0d1a12;--danger:#ff8a80;--chip:#1f2d25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html.native .web-only{display:none!important}
#menu .stack>button,#menu .stack>label{width:100%;justify-content:center}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px}
header h1{font-size:20px;letter-spacing:-.01em;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;
  align-items:center;gap:6px;min-height:42px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--danger)}
button.icon{padding:8px 10px;min-width:42px;justify-content:center}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:14px}
.list{list-style:none;margin:0;padding:0}
.bin{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;cursor:pointer;color:inherit;text-decoration:none}
.bin .tag{font-weight:700;background:var(--chip);color:var(--accent);border-radius:8px;
  padding:6px 9px;font-size:14px;min-width:46px;text-align:center}
.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.qty{display:flex;align-items:center;gap:4px}
.qty span{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.qty button{min-height:34px;padding:4px 10px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 4px 14px rgba(0,0,0,.18)}
.hit{padding:10px 0;border-bottom:1px solid var(--line)}
.hit a{color:var(--accent);text-decoration:none;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));z-index:30;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;
  transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink);
  width:min(440px,calc(100% - 32px));padding:18px}
dialog::backdrop{background:rgba(0,0,0,.4)}
.stack>*+*{margin-top:10px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.linkbox{font-family:ui-monospace,monospace;font-size:13px;word-break:break-all;background:var(--chip);
  padding:8px 10px;border-radius:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
#reader{width:100%;min-height:240px;border-radius:10px;overflow:hidden;background:#000}
#reader video{object-fit:cover}
.qrbox svg{width:100%;height:auto;display:block;background:#fff;border-radius:8px}
.code{display:flex;align-items:center;gap:8px;font-family:ui-monospace,monospace;font-size:13px;
  background:var(--chip);border-radius:8px;padding:4px 4px 4px 10px;margin-top:6px}
.pick{display:block;width:100%;text-align:left;margin-top:6px}
#labels{display:none}
/* --- refreshed look --- */
.ghost{border:0;background:transparent}
.hello{margin:4px 0 18px}
.hello-stats{color:var(--muted);font-size:14px;margin:0 2px 10px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 6px 4px 14px;box-shadow:var(--shadow)}
.search input{border:0;padding:10px 4px;background:transparent}
.search input:focus{outline:none}
.bingrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.bincard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;color:inherit;text-decoration:none;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .12s}
.bincard:active{transform:scale(.98)}
.bincard .cover{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:40px}
.bincard .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bincard .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bincard .meta strong,.bincard .meta .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idchip{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;backdrop-filter:blur(6px)}
.idchip.static,.hero .idchip{position:static}
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:170px;margin-bottom:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:var(--shadow);display:flex}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-in{position:relative;flex:1;padding:14px 16px 16px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55))}
.hero h2{margin:22px 0 8px;font-size:26px;line-height:1.15;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;font-size:13px;backdrop-filter:blur(6px)}
.glass{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(6px)}
.note{background:var(--chip);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:15px}
.seg button{min-width:40px;justify-content:center}
button.icard{font:inherit;color:inherit;text-align:left;padding:0;display:block;min-height:0}
.icard .ph{flex-direction:column;gap:4px}
.icard .ph small{font-size:11px}
.igrid.small{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:12px}
.item .thumb.ph{display:flex;align-items:center;justify-content:center;font-size:20px}
.strip{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.strip img{width:96px;height:96px;flex:none;object-fit:cover;border-radius:12px;background:var(--chip);cursor:pointer}
.actionbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 32px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:6}
.actionbar button{border:0;background:transparent;flex-direction:column;gap:0;font-size:12px;min-height:52px;justify-content:center;border-radius:14px;color:var(--ink)}
.actionbar button span{font-size:20px;line-height:1.2}
.actionbar button:active{background:var(--chip)}
main:has(.actionbar){padding-bottom:110px}
dialog.sheet{margin:auto auto 0;width:100%;max-width:560px;border:0;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
dialog.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
dialog.sheet h3{margin:0 0 6px;font-size:20px}
#sheetBody>*+*{margin-top:12px}
.big-opt{width:100%;display:grid;grid-template-columns:42px 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;padding:12px 14px;border-radius:16px;min-height:0}
.big-opt span{grid-row:1/3;font-size:26px;align-self:center;text-align:center}
.big-opt small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.big-opt:disabled{opacity:.5}
.fl{display:block;font-size:13px;color:var(--muted);font-weight:600}
.fl input,.fl textarea,.fl select{margin-top:4px;font-weight:400;color:var(--ink);font-size:16px}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.ephoto{border-radius:18px;overflow:hidden;background:var(--chip);cursor:pointer}
.ephoto img{display:block;width:100%;max-height:42vh;object-fit:cover}
.ephoto .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:150px;font-size:36px;color:var(--muted)}
.ephoto .ph small{font-size:13px}
.qty.big button{min-height:42px;min-width:44px;font-size:20px;justify-content:center}
.qty.big span{min-width:36px;font-size:18px;font-weight:700}
.linkish{border:0;background:none;width:100%;justify-content:center;min-height:36px}
.tagmsg{background:var(--chip);border-radius:14px;padding:12px 14px}
.pulse{display:inline-block;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}
.hitcard{padding:12px}
.hithead{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.empty .big{font-size:52px}
.empty h2{margin:6px 0;color:var(--ink)}
.empty.small{padding:16px 0;list-style:none}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--chip);flex:none;border:1px solid var(--line);cursor:pointer}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--chip);cursor:pointer}
.photo-pending{position:relative}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:10px}
.icard{position:relative;background:var(--chip);border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid var(--line)}
.icard img,.icard .ph{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.icard .ph{display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
.icard .cap{padding:6px 8px;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icard .q{position:absolute;top:6px;right:6px;background:var(--ink);color:var(--bg);border-radius:10px;padding:1px 7px;font-size:12px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:34px;padding:4px 10px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.hitrow{display:flex;gap:10px;align-items:center;padding:6px 0}
#viewer img{width:100%;max-height:70vh;object-fit:contain;border-radius:10px;background:#000}
.drivebar{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:center}
@media print{
  body>*:not(#labels){display:none!important}
  #labels{display:grid!important;grid-template-columns:repeat(3,1fr);gap:10mm;padding:5mm;background:#fff;color:#000}
  .label{border:1px dashed #999;padding:4mm;text-align:center;break-inside:avoid;font:12pt system-ui}
  .label svg{width:38mm;height:38mm}
  .label b{display:block;font-size:14pt}
}
</style>
</head>
<body>
<header>
  <button id="back" class="icon" aria-label="Back" hidden>←</button>
  <h1 id="title">My Bins</h1>
  <span id="syncDot" class="muted" title="" style="font-size:14px"></span>
  <button id="menuBtn" class="icon" aria-label="Menu">⋯</button>
</header>
<main id="app"></main>
<div id="toast" class="toast"></div>

<dialog id="menu">
  <div class="stack">
    <h3 style="margin:0">Sync &amp; backup</h3>
    <div id="syncPanel" class="card stack" style="margin:0"></div>
    <div id="drivePanel" class="card stack" style="margin:0"></div>
    <a id="getApk" class="btn web-only" hidden style="justify-content:center">🤖 Get the Android app</a>
    <button id="printAll" class="web-only">🖨 Print QR labels for all bins</button>
    <button id="exportBtn" class="web-only">⬇ Export backup (JSON)</button>
    <label class="btn">⬆ Import backup<input id="importFile" type="file" accept="application/json" hidden></label>
    <button id="closeMenu" class="primary">Done</button>
  </div>
</dialog>

<dialog id="scanDlg">
  <div class="stack">
    <h3 style="margin:0" id="scanTitle">Scan a code</h3>
    <div id="reader"></div>
    <p class="muted" id="scanMsg" style="margin:0">Point the camera at a bin's QR code or barcode.</p>
    <button id="scanClose">Cancel</button>
  </div>
</dialog>

<dialog id="pickDlg">
  <div class="stack">
    <h3 style="margin:0">New code</h3>
    <p class="muted" style="margin:0">Code <span class="linkbox" id="pickCode"></span> isn't linked to a bin yet.</p>
    <button id="pickNew" class="primary">＋ Make a new bin for it</button>
    <div id="pickList"></div>
    <button id="pickClose">Cancel</button>
  </div>
</dialog>

<dialog id="qrDlg">
  <div class="stack">
    <h3 style="margin:0" id="qrTitle"></h3>
    <div class="qrbox" id="qrBox"></div>
    <p class="muted" style="margin:0">Scan with any phone camera to open this bin. Print it and stick it on the bin.</p>
    <div class="actions"><button id="qrPrint" class="primary web-only">🖨 Print label</button><button id="qrClose">Close</button></div>
  </div>
</dialog>

<dialog id="sheet" class="sheet"><div id="sheetBody"></div></dialog>

<dialog id="viewer">
  <div class="stack">
    <img id="viewerImg" alt="">
    <p class="muted" id="viewerCap" style="margin:0"></p>
    <div class="actions"><a id="viewerDrive" class="btn" target="_blank" rel="noopener" hidden>Open in Drive</a>
      <button id="viewerDel" class="danger">Delete photo</button><button id="viewerClose" class="primary">Close</button></div>
  </div>
</dialog>
<input id="camInput" type="file" accept="image/*" capture="environment" hidden>

<div id="labels"></div>

<script src="config.js"></script>
<script src="lib/supabase.js"></script>
<script src="lib/capacitor.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/html5-qrcode.min.js"></script>
<script>
"use strict";
const KEY = "bins.v1";
const $ = s => document.querySelector(s);
const app = $("#app");
let state = load();

function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.bins) return s; } catch(e){}
  return { bins:{}, nextNum:1, pushed:{} };
}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ toast("Could not save: "+e.message); } }
function save(){ persist(); Sync.schedule(); }
function uid(){ return Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }
// Running inside the Android app? Then NFC goes through the app's own native code.
const Cap = window.capacitorExports;
const IS_APP = !!(Cap && Cap.Capacitor && Cap.Capacitor.isNativePlatform());
const NativeNfc = IS_APP ? Cap.registerPlugin("NfcBin") : null;
if (IS_APP) document.documentElement.classList.add("native");
// Settings typed into the app (⋯ menu) win over config.js, so nobody has to edit files.
const SAVED_CFG = (() => { try { return JSON.parse(localStorage.getItem("bins.config")) || {}; } catch(e){ return {}; } })();
const CFG = Object.assign({}, window.BINS_CONFIG || {}, Object.fromEntries(Object.entries(SAVED_CFG).filter(([,v]) => v)));
function siteBase(){
  if (!IS_APP) return location.origin + location.pathname;
  let u = (CFG.publicUrl || "").trim();
  return u ? (u.endsWith("/") ? u : u + "/") : "https://bins.invalid/";
}
function binUrl(id){ return siteBase() + "#/bin/" + encodeURIComponent(id); }
function live(b){ return b && !b.deleted; }
function sortedBins(){ return Object.values(state.bins).filter(live).sort((a,b)=>a.label.localeCompare(b.label,undefined,{numeric:true})); }
function itemCount(b){ return b.items.reduce((n,i)=>n+(i.qty||1),0); }

function newBin(id, label){
  if (!id) {
    // next free number across every bin we know about (synced ones too)
    const max = Object.keys(state.bins).reduce((m,k)=>{ const n = /^B(\d+)$/.exec(k); return n ? Math.max(m,+n[1]) : m; }, state.nextNum-1);
    state.nextNum = max + 1;
    id = "B" + String(state.nextNum).padStart(3,"0");
  }
  state.nextNum++;
  state.bins[id] = { id, label: label || id, location:"", notes:"", items:[], codes:[], updated: Date.now() };
  save();
  return state.bins[id];
}

// ---------- routing ----------
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [view, arg] = h.split("/");
  $("#back").hidden = !view;
  if (view === "bin" && arg) return viewBin(arg);
  if (view === "search") return viewSearch(arg || "");
  return viewHome();
}
window.addEventListener("hashchange", route);
$("#back").onclick = () => { location.hash = ""; };

// ---------- shared bits ----------
function binCover(b){
  if (b.photos && b.photos[0]) return b.photos[0];
  const it = (b.items||[]).find(i => i.photo); return it ? it.photo : null;
}
function plural(n, w){ return n + " " + w + (n === 1 ? "" : "s"); }
function sheet(html, onOpen){
  const d = $("#sheet"); $("#sheetBody").innerHTML = html;
  if (!d.open) d.showModal();
  if (onOpen) onOpen(d);
  return d;
}
function closeSheet(){ const d = $("#sheet"); if (d.open) d.close(); }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });   // tap backdrop to close

// ---------- home ----------
function viewHome(){
  $("#title").textContent = "What's in your Bin?";
  const bins = sortedBins();
  const things = bins.reduce((n,b)=>n+itemCount(b),0);
  app.innerHTML = `
    <section class="hello">
      <div class="hello-stats">${bins.length ? `${plural(bins.length,"bin")} · ${plural(things,"thing")} tracked` : "Let's get your stuff organised"}</div>
      <div class="search">
        <span aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="Find anything…" autocomplete="off" enterkeyhint="search">
        <button id="scanBtn" class="icon ghost" aria-label="Scan QR or barcode">📷</button>
      </div>
    </section>
    ${bins.length ? `<div class="bingrid">${bins.map(b=>{ const c = binCover(b); return `
      <a class="bincard" href="#/bin/${encodeURIComponent(b.id)}">
        <div class="cover">${c ? `<img data-photo="${esc(c.id)}" alt="">` : `<span>📦</span>`}<span class="idchip">${esc(b.id)}</span></div>
        <div class="meta"><strong>${esc(b.label)}</strong>
          <span class="muted">${plural(itemCount(b),"thing")}${b.location ? " · " + esc(b.location) : ""}</span></div>
      </a>`; }).join("")}</div>`
    : `<div class="empty"><div class="big">📦</div><h2>No bins yet</h2><p>Make your first bin, add what's inside,<br>then stick a tag on it.</p></div>`}
    <button id="add" class="primary fab">＋ New bin</button>`;
  Photos.hydrate(app);
  const q = $("#q");
  q.addEventListener("keydown", e => { if (e.key==="Enter" && q.value.trim()) location.hash = "#/search/" + encodeURIComponent(q.value.trim()); });
  $("#scanBtn").onclick = () => scan("Scan a bin", openFromCode);
  $("#add").onclick = () => editBin(null);
}

// ---------- search ----------
function viewSearch(term){
  $("#title").textContent = "Search";
  const t = term.toLowerCase();
  const hits = [];
  for (const b of sortedBins()) {
    const binMatch = (b.label+" "+b.location+" "+b.notes).toLowerCase().includes(t);
    const items = b.items.filter(i => (i.name+" "+(i.note||"")).toLowerCase().includes(t));
    if (binMatch || items.length) hits.push({b, items});
  }
  app.innerHTML = `
    <div class="search" style="margin-bottom:16px"><span aria-hidden="true">🔍</span>
      <input id="q" type="search" value="${esc(term)}" placeholder="Find anything…" enterkeyhint="search"></div>
    ${hits.length ? hits.map(({b,items})=>`
      <div class="card hitcard">

// ---------- NFC tag options ----------
const TagCheck = { on: null };      // when set, the next tapped tag is reported here instead of opening a bin
function tagSheet(b){
  const can = !!NativeNfc || ("NDEFReader" in window);
  const status = (msg) => { const el = $("#tagMsg"); if (el) el.innerHTML = msg; };
  sheet(`
    <h3>NFC tag</h3>
    <p class="muted" style="margin:0">Tag for <b>${esc(b.label)}</b> · ${esc(b.id)}</p>
    ${can ? `
    <button class="big-opt" id="tWrite"><span>📲</span><b>Write this bin to a tag</b><small>Works on blank tags, and on tags from another bin (it moves the tag here)</small></button>
    <button class="big-opt" id="tCheck"><span>🔎</span><b>Check a tag</b><small>See which bin a tag opens, without opening it</small></button>
    <button class="big-opt" id="tErase"><span>🧽</span><b>Clear a tag</b><small>Wipe it so it's blank and ready to reuse</small></button>`
    : `<p>Writing tags works in the Android app. On iPhone, copy the link below and write it with the free <b>NFC Tools</b> app (Write → Add a record → URL).</p>
    <div class="linkbox">${esc(binUrl(b.id))}</div><button class="big-opt" id="tCopy"><span>🔗</span><b>Copy link</b><small>Then paste it into NFC Tools</small></button>`}
    <div id="tagMsg" class="tagmsg" hidden></div>
    <button id="tCancel" class="linkish" hidden>Cancel</button>`, d => {
      const msg = (html) => { const el = $("#tagMsg"); el.hidden = !html; el.innerHTML = html || ""; };
      const busy = (on) => { $("#tCancel").hidden = !on; ["tWrite","tCheck","tErase"].forEach(id => { const x = $("#"+id); if (x) x.disabled = on; }); };
      let webAbort = null;
      const cancel = () => { if (NativeNfc) NativeNfc.cancelWrite(); if (webAbort) webAbort.abort(); TagCheck.on = null; busy(false); msg(""); };
      $("#tCancel").onclick = cancel;
      d.addEventListener("close", () => { if (!$("#tCancel").hidden) cancel(); }, { once: true });
      const ready = async () => {
        if (!NativeNfc) return true;
        const st = await NativeNfc.status();
        if (!st.available) { msg("This phone doesn't have NFC. Use a QR label instead (⋯ More)."); return false; }
        if (!st.enabled) { msg("NFC is turned off. Turn it on, then try again."); NativeNfc.openSettings(); return false; }
        return true;
      };
      const run = async (label, nativeFn, webRecords, done) => {
        if (!(await ready())) return;
        busy(true); msg(`<span class="pulse">📶</span> ${label}`);
        try {
          if (NativeNfc) await nativeFn();
          else { webAbort = new AbortController(); await new NDEFReader().write({ records: webRecords }, { signal: webAbort.signal }); }
          if (navigator.vibrate) navigator.vibrate(80); msg(done);
        } catch (e) { msg(e.message === "Cancelled" || e.name === "AbortError" ? "" : "⚠︎ " + esc(e.message)); }
        busy(false);
      };
      if ($("#tWrite")) $("#tWrite").onclick = () => run("Hold the tag to the back of your phone…",
        () => NativeNfc.write({ url: binUrl(b.id) }), [{ recordType: "url", data: binUrl(b.id) }],
        `✅ Done. This tag now opens <b>${esc(b.label)}</b>.`);
      if ($("#tErase")) $("#tErase").onclick = () => run("Hold the tag you want to clear…",
        () => NativeNfc.erase(), [{ recordType: "empty" }], "✅ Tag cleared. It's blank and ready to reuse.");
      if ($("#tCheck")) $("#tCheck").onclick = async () => {
        if (!(await ready())) return;
        busy(true); msg(`<span class="pulse">📶</span> Hold a tag to your phone…`);
        const report = url => {
          TagCheck.on = null; busy(false);
          if (!url) { msg("This tag is blank."); return; }
          const id = binIdFromText(url), hit = id ? state.bins[id] : findByCode(url);
          msg(hit && live(hit) ? `This tag opens <b>${esc(hit.label)}</b> (${esc(hit.id)})${hit.location ? " · 📍 " + esc(hit.location) : ""}.`
            : id ? `This tag is for bin ${esc(id)}, which isn't set up yet.` : `This tag holds: <span class="linkbox">${esc(url)}</span>`);
        };
        if (NativeNfc) TagCheck.on = report;
        else {
          webAbort = new AbortController(); const r = new NDEFReader();
          r.onreading = ev => { const rec = ev.message.records.find(x => x.recordType === "url"); webAbort.abort(); report(rec ? new TextDecoder().decode(rec.data) : null); };
          r.scan({ signal: webAbort.signal }).catch(e => { busy(false); msg("⚠︎ " + esc(e.message)); });
        }
      };
      if ($("#tCopy")) $("#tCopy").onclick = async () => { try { await navigator.clipboard.writeText(binUrl(b.id)); toast("Link copied"); } catch(e){ toast("Copy failed"); } };
    });
}

// ---------- photos ----------
// Photos are kept on the phone (IndexedDB) first, then uploaded to Google Drive when connected.
// A bin/item stores a small ref {id, d}: d = the Google Drive file id once uploaded.
const Photos = (() => {
  let dbp = null; const urls = {};
  function db(){
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open("bins-photos", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("p");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(mode, fn){ const d = await db(); return new Promise((res, rej) => { const t = d.transaction("p", mode); const q = fn(t.objectStore("p")); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); }
  const get = id => tx("readonly", s => s.get(id)).catch(() => null);
  const put = (id, blob) => tx("readwrite", s => s.put(blob, id));
  const del = id => tx("readwrite", s => s.delete(id)).catch(() => {});

  // every photo ref in every live bin, with a back-pointer to its owner
  function allRefs(){
    const out = [];
    for (const b of Object.values(state.bins)) {
      if (!live(b)) continue;
      for (const ph of (b.photos||[])) out.push({ ref: ph, bin: b, item: null });
      for (const it of (b.items||[])) if (it.photo) out.push({ ref: it.photo, bin: b, item: it });
    }
    return out;
  }
  function find(id){ return allRefs().find(x => x.ref.id === id); }
  function pendingCount(){ return allRefs().filter(x => !x.ref.d).length; }

  async function shrink(file){
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Couldn't read that image")); i.src = URL.createObjectURL(file); });
    const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
    return new Promise(res => c.toBlob(res, "image/jpeg", 0.8));
  }
  let onPicked = null;
  $("#camInput").onchange = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f || !onPicked) return;
    try { const blob = await shrink(f); const cb = onPicked; onPicked = null; await cb(blob); toast("Photo saved"); }
    catch (err) { toast(err.message); }
  };
  function capture(cb){ onPicked = cb; $("#camInput").click(); }
  async function add(blob){ const id = "p" + Date.now().toString(36) + uid(); await put(id, blob); return { id }; }

  async function url(ref){
    if (urls[ref.id]) return urls[ref.id];
    let blob = await get(ref.id);
    if (!blob && ref.d) {
      blob = await Drive.download(ref.d);              // signed in to Drive: fetch and keep a copy
      if (blob) put(ref.id, blob).catch(()=>{});
      else return Drive.publicThumb(ref.d);            // otherwise Drive's shared thumbnail
    }
    if (!blob) return "";
    return urls[ref.id] = URL.createObjectURL(blob);
  }
  function hydrate(root){
    root.querySelectorAll("img[data-photo]").forEach(async img => {
      const hit = find(img.dataset.photo); if (!hit) return;
      const u = await url(hit.ref); if (u) img.src = u;
      if (img.dataset.view) img.onclick = e => { e.preventDefault(); e.stopPropagation(); view(hit.ref.id); };
    });
  }
  async function view(id){
    const hit = find(id); if (!hit) return;
    $("#viewerImg").src = await url(hit.ref);
    $("#viewerCap").textContent = (hit.item ? hit.item.name + " · " : "") + "in " + hit.bin.label + (hit.bin.location ? " · 📍 " + hit.bin.location : "");
    const a = $("#viewerDrive"); a.hidden = !hit.ref.d; if (hit.ref.d) a.href = "https://drive.google.com/file/d/" + hit.ref.d + "/view";
    $("#viewerDel").onclick = async () => {
      if (!confirm("Delete this photo?")) return;
      if (hit.item) delete hit.item.photo; else hit.bin.photos = hit.bin.photos.filter(p => p.id !== id);
      hit.bin.updated = Date.now(); save(); del(id); if (hit.ref.d) Drive.remove(hit.ref.d);
      $("#viewer").close(); api.onChange();
    };
    $("#viewer").showModal();
  }
  $("#viewerClose").onclick = () => $("#viewer").close();

  // upload every photo that isn't in Drive yet
  async function uploadPending(){
    let n = 0;
    for (const x of allRefs().filter(x => !x.ref.d)) {
      const blob = await get(x.ref.id); if (!blob) continue;
      const name = (x.item ? x.item.name : "Bin photo") + " — in " + x.bin.label + (x.bin.location ? " (" + x.bin.location + ")" : "") + ".jpg";
      const desc = `${x.item ? x.item.name : "Photo of bin"} is in bin ${x.bin.id} "${x.bin.label}"` + (x.bin.location ? `, kept at: ${x.bin.location}` : "") + `.\nOpen the bin: ${binUrl(x.bin.id)}`;
      const d = await Drive.upload(blob, name, desc);
      const again = find(x.ref.id); if (!again) continue;     // deleted while uploading
      again.ref.d = d; again.bin.updated = Date.now(); n++;
    }
    if (n) save();
    return n;
  }
  const api = { capture, add, hydrate, view, uploadPending, pendingCount, onChange(){} };
  return api;
})();

// ---------- Google Drive ----------
// Android app: the phone's Google account picker (native). Website/iPhone: Google's sign-in popup.
// Scope drive.file = the app only sees files it created. Photos are shared "anyone with the link"
// so your other phones (other Google accounts) can show them too.
const Drive = (() => {
  const NativeG = IS_APP ? Cap.registerPlugin("GoogleDrive") : null;
  const SCOPE = "https://www.googleapis.com/auth/drive.file";
  const FOLDER = "What's in your Bin — photos";
  let token = null, tokenExp = 0, gisClient = null, busy = false, lastErr = "";
  const connectedFlag = () => { try { return localStorage.getItem("bins.drive") === "1"; } catch(e){ return false; } };
  const setConnected = v => { try { v ? localStorage.setItem("bins.drive","1") : localStorage.removeItem("bins.drive"); } catch(e){} };
  function configured(){ return connectedFlag(); }
  function canConnect(){ return IS_APP || !!CFG.googleClientId; }

  function loadGis(){
    return new Promise((res, rej) => {
      if (window.google && google.accounts && google.accounts.oauth2) return res();
      const sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client"; sc.onload = res; sc.onerror = () => rej(new Error("Couldn't load Google sign-in")); document.head.appendChild(sc);
    });
  }
  async function getToken(interactive){
    if (token && Date.now() < tokenExp) return token;
    if (NativeG) {
      const r = await NativeG.getToken({ interactive });
      token = r.accessToken; tokenExp = Date.now() + 50*60*1000; return token;
    }
    if (!CFG.googleClientId) throw new Error("Add your Google client ID in ⋯ first");
    await loadGis();
    return new Promise((res, rej) => {
      gisClient = google.accounts.oauth2.initTokenClient({
        client_id: CFG.googleClientId, scope: SCOPE,
        callback: r => { if (r.error) return rej(new Error(r.error_description || r.error)); token = r.access_token; tokenExp = Date.now() + (r.expires_in - 120) * 1000; res(token); },
        error_callback: e => rej(new Error(e.message || e.type || "Sign-in closed"))
      });
      gisClient.requestAccessToken({ prompt: interactive ? "" : "none" });
    });
  }
  async function gfetch(url, opts = {}, interactive = false){
    const t = await getToken(interactive);
    const r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ Authorization: "Bearer " + t }, opts.headers || {}) }));
    if (r.status === 401) { token = null; throw new Error("Google sign-in expired"); }
    if (!r.ok) throw new Error("Google Drive error " + r.status + ": " + (await r.text()).slice(0, 160));
    return r;
  }
  async function folderId(){
    try { const f = localStorage.getItem("bins.driveFolder"); if (f) return f; } catch(e){}
    const q = encodeURIComponent(`name='${FOLDER.replace(/'/g, "\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    const found = await (await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`)).json();
    let id = found.files && found.files[0] && found.files[0].id;
    if (!id) {
      const r = await gfetch("https://www.googleapis.com/drive/v3/files?fields=id", { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ name: FOLDER, mimeType: "application/vnd.google-apps.folder" }) });
      id = (await r.json()).id;
    }
    try { localStorage.setItem("bins.driveFolder", id); } catch(e){}
    return id;
  }
  async function upload(blob, name, description){
    const parent = await folderId();
    const meta = { name, description, parents: [parent], mimeType: "image/jpeg" };
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
    form.append("file", blob);
    const r = await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", { method:"POST", body: form });
    const id = (await r.json()).id;
    // let your other phones see it without each signing in to this Google account
    await gfetch(`https://www.googleapis.com/drive/v3/files/${id}/permissions?fields=id`, { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ role: "reader", type: "anyone" }) }).catch(() => {});
    return id;
  }
  async function download(id){
    if (!configured()) return null;
    try { return await (await gfetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).blob(); } catch(e){ return null; }
  }
  function publicThumb(id){ return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w1200"; }
  async function remove(id){ try { await gfetch(`https://www.googleapis.com/drive/v3/files/${id}`, { method:"DELETE" }); } catch(e){} }

  async function flush(){
    if (!configured() || busy || !navigator.onLine) return;
    busy = true;
    try { const n = await Photos.uploadPending(); lastErr = ""; if (n) { toast(`${n} photo${n>1?"s":""} saved to Google Drive`); Photos.onChange(); } }
    catch (e) { lastErr = e.message; }
    finally { busy = false; if ($("#menu").open) renderPanel(); }
  }
  async function connect(){
    try { await getToken(true); setConnected(true); await folderId(); toast("Google Drive connected"); flush(); }
    catch (e) { lastErr = e.message === "Cancelled" ? "" : e.message; }
    renderPanel(); Photos.onChange();
  }
  function renderPanel(){
    const el = $("#drivePanel");
    if (!canConnect()) {
      el.innerHTML = `<strong>Google Drive photos</strong><p class="muted" style="margin:0">To back up photos to Drive from the website, paste your Google client ID in the sync settings above (see the README).</p>`;
      return;
    }
    const pend = Photos.pendingCount();
    el.innerHTML = configured()
      ? `<strong>Google Drive photos: connected</strong>
         <p class="muted" style="margin:0">Photos go to the “${esc(FOLDER)}” folder in your Drive.${pend ? ` ${pend} waiting to upload.` : " All uploaded."}${lastErr ? " ⚠︎ " + esc(lastErr) : ""}</p>
         <div class="actions">${pend ? `<button id="driveNow">Upload now</button>` : ""}<button id="driveOff">Disconnect</button></div>`
      : `<strong>Google Drive photos</strong>
         <p class="muted" style="margin:0">Back up bin photos to your Google Drive and show them on your other phones.${lastErr ? " ⚠︎ " + esc(lastErr) : ""}</p>
         <button id="driveOn" class="primary">Connect Google Drive</button>`;
    if ($("#driveOn")) $("#driveOn").onclick = connect;
    if ($("#driveNow")) $("#driveNow").onclick = () => { getToken(true).then(flush, e => { lastErr = e.message; renderPanel(); }); };
    if ($("#driveOff")) $("#driveOff").onclick = () => { setConnected(false); token = null; try { localStorage.removeItem("bins.driveFolder"); } catch(e){} renderPanel(); };
  }
  window.addEventListener("online", flush);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") flush(); });
  return { configured, upload, download, publicThumb, remove, flush, renderPanel };
})();

// ---------- QR codes & scanning ----------
function qrSvg(text){ const q = qrcode(0,"M"); q.addData(text); q.make(); return q.createSvgTag({cellSize:6, margin:2, scalable:true}); }
function labelHtml(b){ return `<div class="label">${qrSvg(binUrl(b.id))}<b>${esc(b.label)}</b>${esc(b.id)}${b.location?" · "+esc(b.location):""}</div>`; }
function printLabels(bins){
  if (!bins.length) { toast("No bins to print yet"); return; }
  $("#labels").innerHTML = bins.map(labelHtml).join("");
  setTimeout(() => window.print(), 50);
}
function showQr(b){
  $("#qrTitle").textContent = b.label;
  $("#qrBox").innerHTML = qrSvg(binUrl(b.id));
  $("#qrPrint").onclick = () => printLabels([b]);
  $("#qrDlg").showModal();
}
$("#qrClose").onclick = () => $("#qrDlg").close();
$("#printAll").onclick = () => { $("#menu").close(); printLabels(sortedBins()); };

function findByCode(code){ return Object.values(state.bins).filter(live).find(b => (b.codes||[]).includes(code)); }
function binIdFromText(text){
  const m = String(text).match(/#\/bin\/([^\/?#\s]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}
function openFromCode(text){
  const id = binIdFromText(text);
  if (id) { location.hash = "#/bin/" + encodeURIComponent(id); return; }
  const hit = findByCode(text);
  if (hit) { location.hash = "#/bin/" + encodeURIComponent(hit.id); return; }
  // unknown barcode: new bin or link to existing
  $("#pickCode").textContent = text;
  const bins = sortedBins();
  $("#pickList").innerHTML = bins.length ? `<p class="muted" style="margin:0">…or link it to a bin you already have:</p>` +
    bins.map(b=>`<button class="pick" data-id="${esc(b.id)}">${esc(b.label)} <span class="muted">${esc(b.id)}</span></button>`).join("") : "";
  $("#pickList").onclick = e => {
    const btn = e.target.closest("[data-id]"); if (!btn) return;
    const b = state.bins[btn.dataset.id]; (b.codes = b.codes||[]).push(text); b.updated = Date.now(); save();
    $("#pickDlg").close(); location.hash = "#/bin/" + encodeURIComponent(b.id); toast("Barcode linked");
  };
  $("#pickNew").onclick = () => {
    const b = newBin(null, null); b.codes.push(text); save();
    $("#pickDlg").close(); location.hash = "#/bin/" + encodeURIComponent(b.id);
  };
  $("#pickDlg").showModal();
}
$("#pickClose").onclick = () => $("#pickDlg").close();

let scanner = null;
async function stopScan(){
  if (scanner) { try { await scanner.stop(); } catch(e){} try { scanner.clear(); } catch(e){} scanner = null; }
}
async function scan(title, onCode){
  if (typeof Html5Qrcode === "undefined") { toast("Scanner failed to load"); return; }
  $("#scanTitle").textContent = title;
  $("#scanMsg").textContent = "Point the camera at a QR code or barcode.";
  $("#scanDlg").showModal();
  await stopScan();
  scanner = new Html5Qrcode("reader", { verbose:false, experimentalFeatures:{ useBarCodeDetectorIfSupported:true } });
  let done = false;
  try {
    await scanner.start({ facingMode:"environment" }, { fps:10, qrbox:(w,h)=>({ width:Math.floor(Math.min(w,h)*0.8), height:Math.floor(Math.min(w,h)*0.6) }) },
      async text => {
        if (done) return; done = true;
        if (navigator.vibrate) navigator.vibrate(60);
        await stopScan(); $("#scanDlg").close(); onCode(text.trim());
      }, () => {});
  } catch (e) {
    $("#scanMsg").textContent = "Camera unavailable: " + (e.message || e) + ". The page must be on https and allowed to use the camera.";
  }
}
$("#scanClose").onclick = async () => { await stopScan(); $("#scanDlg").close(); };
$("#scanDlg").addEventListener("close", stopScan);

// ---------- backup ----------
$("#menuBtn").onclick = () => { Sync.renderPanel(); Drive.renderPanel(); $("#menu").showModal(); };
$("#closeMenu").onclick = () => $("#menu").close();
$("#exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "bins-backup-" + new Date().toISOString().slice(0,10) + ".json"; a.click();
};
$("#importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s.bins) throw new Error("not a bins backup");
    if (!confirm(`Restore ${Object.keys(s.bins).length} bins from the backup? Bins with the same id are replaced.`)) return;
    const now = Date.now();
    for (const b of Object.values(s.bins)) { b.updated = now; state.bins[b.id] = b; }  // merge, and mark for upload
    save(); $("#menu").close(); location.hash=""; route(); toast("Backup restored");
  } catch(err){ toast("Import failed: " + err.message); }
};

// ---------- sync (Supabase) ----------
// Each bin is one row: {id, data, deleted, updated_at}. Newest edit of a bin wins.
// Local storage stays the source for the UI, so the app works offline and catches up later.
const Sync = (() => {
  const cfg = CFG;
  const enabled = !!(cfg.supabaseUrl && cfg.supabaseAnonKey && window.supabase);
  const sb = enabled ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey) : null;
  let user = null, timer = null, busy = false, again = false, status = "", lastOk = 0, channel = null;
  state.pushed = state.pushed || {};

  function setStatus(s, title){ status = s; const d = $("#syncDot"); d.textContent = s; d.title = title || ""; }
  function editing(){ const a = document.activeElement; return a && /INPUT|TEXTAREA/.test(a.tagName) && !$("#menu").open; }
  function rerender(){ if (!editing() && !document.querySelector("dialog[open]")) route(); }

  function applyRow(r){
    const local = state.bins[r.id];
    const localT = local ? local.updated || 0 : -1;
    if (r.updated_at > localT) {
      state.bins[r.id] = r.deleted ? { id:r.id, deleted:true, updated:r.updated_at } : Object.assign({}, r.data, { id:r.id, updated:r.updated_at });
      state.pushed[r.id] = r.updated_at;
      return true;
    }
    if (r.updated_at === localT) state.pushed[r.id] = localT;  // server already has this exact version
    return false;
  }

  async function run(){
    if (!user) return;
    if (busy) { again = true; return; }
    busy = true; setStatus("⟳", "Syncing…");
    try {
      // 1. pull everything (a household has hundreds of bins at most)
      const { data: rows, error } = await sb.from("bins").select("id,data,deleted,updated_at");
      if (error) throw error;
      let changed = false;
      for (const r of rows) changed = applyRow(r) || changed;
      // 2. push local edits the server hasn't seen
      const dirty = Object.values(state.bins).filter(b => (b.updated||0) > (state.pushed[b.id]||0));
      if (dirty.length) {
        const payload = dirty.map(b => { const { updated, ...data } = b;
          return { id:b.id, data: b.deleted ? {} : data, deleted: !!b.deleted, updated_at: updated }; });
        const { error: e2 } = await sb.from("bins").upsert(payload);
        if (e2) throw e2;
        for (const b of dirty) state.pushed[b.id] = b.updated;
      }
      persist(); lastOk = Date.now();
      setStatus("☁︎", "Synced " + new Date(lastOk).toLocaleTimeString());
      if (changed) rerender();
    } catch (e) {
      setStatus(navigator.onLine ? "⚠︎" : "⌁", navigator.onLine ? "Sync problem: " + (e.message||e) : "Offline. Changes will sync when you're back online.");
    } finally {
      busy = false;
      if ($("#menu").open) renderPanel();
      if (again) { again = false; run(); }
    }
  }
  function schedule(){ if (!user) return; clearTimeout(timer); timer = setTimeout(run, 700); }

  function subscribe(){
    if (channel) return;
    channel = sb.channel("bins-live").on("postgres_changes", { event:"*", schema:"public", table:"bins" }, p => {
      if (p.new && p.new.id && applyRow(p.new)) { persist(); rerender(); }
    }).subscribe();
  }
  async function onAuth(session){
    user = session ? session.user : null;
    if (user) { subscribe(); run(); }
    else { if (channel) { sb.removeChannel(channel); channel = null; } setStatus("", ""); }
    if ($("#menu").open) renderPanel();
  }

  let editingCfg = false;
  function renderSetup(el){
    el.innerHTML = `<strong>${enabled ? "Sync settings" : "Share bins across phones"}</strong>
      <p class="muted" style="margin:0">Paste the two values from your Supabase project (Project Settings → API). Do this once on each phone.</p>
      <form id="cfgForm" class="stack">
        <input id="cfgUrl" type="url" placeholder="Project URL (https://….supabase.co)" value="${esc(cfg.supabaseUrl||"")}" autocomplete="off">
        <input id="cfgKey" placeholder="anon public key" value="${esc(cfg.supabaseAnonKey||"")}" autocomplete="off">
        ${!IS_APP ? `<input id="cfgGoogle" placeholder="Google client ID (for Drive photos, optional)" value="${esc(cfg.googleClientId||"")}" autocomplete="off">` : ""}
        ${IS_APP ? `<input id="cfgSite" type="url" placeholder="Your website (https://you.github.io/bins/)" value="${esc(cfg.publicUrl||"")}" autocomplete="off">
        <p class="muted" style="margin:0">The website is what NFC tags and QR labels link to, so iPhones can open them too.</p>` : ""}
        <div class="actions"><button class="primary">Save</button>${enabled ? `<button type="button" id="cfgCancel">Cancel</button>` : ""}</div>
      </form>`;
    $("#cfgForm").onsubmit = e => {
      e.preventDefault();
      const next = { supabaseUrl: $("#cfgUrl").value.trim(), supabaseAnonKey: $("#cfgKey").value.trim() };
      if (IS_APP) next.publicUrl = $("#cfgSite").value.trim();
      else next.googleClientId = $("#cfgGoogle").value.trim();
      try { localStorage.setItem("bins.config", JSON.stringify(next)); } catch(err){}
      location.reload();
    };
    if (enabled) $("#cfgCancel").onclick = () => { editingCfg = false; renderPanel(); };
  }

  function renderPanel(){
    const el = $("#syncPanel");
    if (!enabled || editingCfg) { renderSetup(el); return; }
    if (!user) {
      el.innerHTML = `<strong>Sign in to sync</strong>
        <form id="signIn" class="stack"><input id="em" type="email" placeholder="Email" autocomplete="username" required>
        <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
        <button class="primary">Sign in</button><p class="muted" id="authMsg" style="margin:0"></p></form>`;
      $("#signIn").onsubmit = async e => {
        e.preventDefault(); $("#authMsg").textContent = "Signing in…";
        const { error } = await sb.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
        $("#authMsg").textContent = error ? error.message : "";
      };
      return;
    }
    el.innerHTML = `<strong>Syncing as ${esc(user.email||"you")}</strong>
      <p class="muted" style="margin:0">${lastOk ? "Last synced " + new Date(lastOk).toLocaleTimeString() : "Not synced yet"}${status==="⚠︎"||status==="⌁" ? " · " + esc($("#syncDot").title) : ""}</p>
      <div class="actions"><button id="syncNow">Sync now</button><button id="signOut">Sign out</button></div>`;
    $("#syncNow").onclick = run;
    el.insertAdjacentHTML("beforeend", `<button id="editCfg" style="min-height:0;border:0;padding:0;color:var(--muted);font-size:13px;background:none">Change sync settings</button>`);
    $("#editCfg").onclick = () => { editingCfg = true; renderPanel(); };
    $("#signOut").onclick = () => sb.auth.signOut();
  }

  if (enabled) {
    sb.auth.onAuthStateChange((_ev, session) => setTimeout(() => onAuth(session), 0));
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") schedule(); });
    window.addEventListener("online", schedule);
  }
  return { schedule, run, renderPanel, get user(){ return user; }, enabled };
})();

// Tags tapped while the app is open (or the tag that launched it) open the right bin.
if (!IS_APP && CFG.apkUrl && /Android/i.test(navigator.userAgent)) { $("#getApk").href = CFG.apkUrl; $("#getApk").hidden = false; }
// Opened in Chrome on Android (e.g. an older tag)? Offer a one-tap jump into the app.
if (!IS_APP && /Android/i.test(navigator.userAgent) && location.hash.startsWith("#/bin/")) {
  const u = new URL(location.href);
  const intent = `intent://${u.host}${u.pathname}${u.hash}#Intent;scheme=https;package=app.bins.tracker;S.browser_fallback_url=${encodeURIComponent(location.href)};end`;
  const bar = document.createElement("a");
  bar.href = intent; bar.className = "btn primary"; bar.textContent = "Open in the app";
  bar.style.cssText = "position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));justify-content:center;z-index:20";
  document.body.appendChild(bar);
}
if (NativeNfc) {
  NativeNfc.addListener("tag", ({ url }) => {
    if (TagCheck.on) { TagCheck.on(url); return; }
    if (url) openFromCode(url);
    else toast("Blank tag. Open a bin and tap “Write to NFC tag”.");
  });
  NativeNfc.takeLaunchUrl().then(({ url }) => { if (url) openFromCode(url); });
}

setTimeout(() => Drive.flush(), 1500);

if (!IS_APP && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
route();
</script>
